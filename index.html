<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>One Aspal Club - Riding Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* FIXING HEIGHT: html & body wajib di-set 100% agar h-full berfungsi di dalam iframe */
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      background: #e5e7eb; 
    }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-user-select: none; 
      user-select: none; 
      overflow: hidden; 
    }
    #map { 
      width: 100%; 
      height: 100%; 
      background: #e5e7eb; 
    }
    .glass-panel { 
      background: rgba(255, 255, 255, 0.75); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      border-top: 1px solid rgba(255,255,255,0.6); 
      box-shadow: 0 -10px 40px rgba(0,0,0,0.1); 
    }
    .leaflet-pane, .leaflet-top, .leaflet-bottom { z-index: 1 !important; }
    
    /* Animasi Getaran Motor Matic */
    @keyframes bikeRumble {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-0.3px, -0.5px) rotate(-0.8deg); }
      50% { transform: translate(0.3px, 0) rotate(0.5deg); }
      75% { transform: translate(-0.3px, 0.5px) rotate(-0.5deg); }
      100% { transform: translate(0.3px, -0.5px) rotate(0.8deg); }
    }
    .bike-moving-icon svg {
      animation: bikeRumble 0.15s infinite linear;
      filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body class="text-slate-800">
  <div class="relative w-full h-full flex flex-col">
    
    <!-- Map Container -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- Header Floating -->
    <div class="absolute top-0 left-0 right-0 z-10 p-4 pt-[calc(env(safe-area-inset-top)+1rem)]">
      <div class="glass-panel rounded-2xl p-3 flex items-center justify-between shadow-md" style="background: rgba(255, 255, 255, 0.85);">
        <div class="flex items-center space-x-2">
          <div class="w-9 h-9 rounded-full bg-amber-100 flex items-center justify-center text-xl">🏍️</div>
          <div>
            <h1 class="text-sm font-black text-slate-900 tracking-wide">RIDING TRACKER</h1>
            <p id="statusText" class="text-[10px] font-bold text-slate-500">Siap memulai perjalanan</p>
          </div>
        </div>
        <button id="centerBtn" class="p-2 bg-slate-100 rounded-xl active:scale-90 transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-slate-700"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Bottom Panel (Stats & Controls) -->
    <div class="absolute bottom-0 left-0 right-0 z-10 glass-panel rounded-t-[32px] p-6 pb-[calc(env(safe-area-inset-bottom)+1.5rem)]">
      
      <!-- Stats Grid -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-slate-50/80 border border-slate-100 rounded-2xl p-4 text-center">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Kecepatan</p>
          <div class="flex items-end justify-center">
            <span id="speedVal" class="text-3xl font-black text-slate-900">0.0</span>
            <span class="text-xs font-bold text-slate-500 ml-1 mb-1">km/jam</span>
          </div>
        </div>
        <div class="bg-slate-900 rounded-2xl p-4 text-center shadow-lg">
          <p class="text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-1">Jarak Tempuh</p>
          <div class="flex items-end justify-center">
            <span id="distVal" class="text-3xl font-black text-white">0.00</span>
            <span class="text-xs font-bold text-slate-400 ml-1 mb-1">km</span>
          </div>
        </div>
      </div>

      <!-- Duration & Action Button -->
      <div class="flex items-center space-x-4">
        <div class="flex flex-col items-center justify-center bg-slate-50 border border-slate-100 rounded-2xl p-3 w-20 h-16">
          <span id="timeVal" class="text-base font-black text-slate-800 tabular-nums">00:00</span>
          <span class="text-[9px] font-bold text-slate-500 uppercase">Durasi</span>
        </div>
        
        <button id="trackBtn" class="flex-1 h-16 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-black text-base rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>Mulai Perjalanan</span>
        </button>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, polyline;
    let isTracking = false, watchId = null, pathCoordinates = [], totalDistance = 0, lastCoord = null, startTime = null, timerInterval = null;

    const URL_GEOJSON_ROUTE = ""; 

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([-6.2088, 106.8456], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      if (URL_GEOJSON_ROUTE !== "") {
        fetch(URL_GEOJSON_ROUTE).then(res => res.json()).then(data => {
          L.geoJSON(data, { style: { color: "#3b82f6", weight: 5, opacity: 0.7, dashArray: "10, 10" } }).addTo(map);
        }).catch(err => console.warn("Gagal memuat GeoJSON:", err));
      }

      polyline = L.polyline([], { color: '#f59e0b', weight: 5 }).addTo(map);

      document.getElementById('centerBtn').addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => { map.panTo([pos.coords.latitude, pos.coords.longitude]); });
        }
      });
    }

    document.getElementById('trackBtn').addEventListener('click', toggleTracking);

    function toggleTracking() { isTracking ? stopTracking() : startTracking(); }

    function startTracking() {
      if (!navigator.geolocation) { alert("Browser tidak mendukung GPS."); return; }
      isTracking = true; pathCoordinates = []; totalDistance = 0; lastCoord = null; startTime = Date.now(); polyline.setLatLngs([]);
      
      const btn = document.getElementById('trackBtn');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Selesai Perjalanan</span>`;
      btn.classList.remove('from-amber-500', 'to-amber-600'); btn.classList.add('from-rose-500', 'to-rose-600');
      document.getElementById('statusText').innerText = "Sedang melacak..."; document.getElementById('statusText').classList.add('text-emerald-600');
      document.getElementById('speedVal').innerText = "0.0"; document.getElementById('distVal').innerText = "0.00";

      // Ikon Motor Matic Tajam & Animasi Getar
      const bikeIcon = L.divIcon({
        className: 'bike-moving-icon',
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64" fill="none">
          <ellipse cx="32" cy="52" rx="18" ry="3" fill="rgba(0,0,0,0.3)"/>
          <path d="M14 52 H50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.7"/>
          <circle cx="16" cy="44" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
          <circle cx="16" cy="44" r="4" fill="#334155"/>
          <path d="M16 40 V48 M12 44 H20" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="48" cy="44" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
          <circle cx="48" cy="44" r="4" fill="#334155"/>
          <path d="M48 40 V48 M44 44 H52" stroke="#f59e0b" stroke-width="1.5"/>
          <path d="M16 44 C16 35, 22 30, 30 28 L40 26 C46 25, 50 32, 48 40 L48 44" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M30 28 L35 20 H42 C44 20, 45 22, 44 24 L40 26" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M44 30 C46 30, 48 32, 48 35 L44 35 Z" fill="#fef3c7" stroke="#ffffff" stroke-width="1"/>
          <path d="M40 26 L38 18 M42 18 H34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="42" cy="18" r="2" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
          <circle cx="34" cy="18" r="2" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
          <path d="M22 32 C25 28, 30 27, 34 29 L32 33 H22Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
        </svg>`,
        iconSize: [48, 48],
        iconAnchor: [24, 42]
      });

      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([-6.2088, 106.8456], { icon: bikeIcon }).addTo(map);
      timerInterval = setInterval(updateTimer, 1000);
      watchId = navigator.geolocation.watchPosition(onSuccess, onError, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }

    function stopTracking() {
      isTracking = false;
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      clearInterval(timerInterval);
      const btn = document.getElementById('trackBtn');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Mulai Perjalanan</span>`;
      btn.classList.add('from-amber-500', 'to-amber-600'); btn.classList.remove('from-rose-500', 'to-rose-600');
      document.getElementById('statusText').innerText = "Perjalanan dihentikan"; document.getElementById('statusText').classList.remove('text-emerald-600');
      document.getElementById('speedVal').innerText = "0.0";
    }

    function onSuccess(position) {
      const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
      if (userMarker) userMarker.setLatLng([pos.lat, pos.lng]);
      map.panTo([pos.lat, pos.lng]);
      pathCoordinates.push([pos.lat, pos.lng]); polyline.setLatLngs(pathCoordinates);
      if (lastCoord) {
        const dist = calculateDistance(lastCoord.lat, lastCoord.lng, pos.lat, pos.lng);
        if (dist > 0.002) { totalDistance += dist; }
      }
      lastCoord = pos;
      let speed = position.coords.speed ? position.coords.speed * 3.6 : 0;
      document.getElementById('speedVal').innerText = speed.toFixed(1);
      document.getElementById('distVal').innerText = totalDistance.toFixed(2);
    }

    function onError(err) { document.getElementById('statusText').innerText = "Gagal mendapatkan GPS"; }
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function updateTimer() {
      if (!startTime) return;
      const e = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('timeVal').innerText = `${String(Math.floor(e / 60)).padStart(2, '0')}:${String(e % 60).padStart(2, '0')}`;
    }
    window.onload = initMap;
  </script>
</body>
</html>
